  optimizer: muon
  num_train_epochs: 29000
  micro_batch_size: 16
  global_batch_size: 128
  gradient_accumulation_steps: 1
  max_steps: 50000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 29000
  enable_resume: false
  seed: 42
  align_params:
    mode: query
    num_task_tokens: 8
    depth_loss_weight: 0.004
    future_depth_loss_weight: 0.004
